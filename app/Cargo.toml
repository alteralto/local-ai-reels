[workspace]
resolver = "2"
members = ["reels-core", "reels-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
reels-core = { path = "reels-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "signal"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
ratatui = "0.29"
anyhow = "1"
libc = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
