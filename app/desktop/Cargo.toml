[package]
name = "reels-desktop"
version = "0.1.0"
edition = "2021"
description = "Настольное приложение для конвейера local-ai-reels"
license = "Apache-2.0"
publish = false
default-run = "reels-desktop"

# Отдельный пакет, не член рабочего пространства app/ (reels-core, reels-app).
[workspace]

[lib]
name = "reels_desktop"
path = "src/lib.rs"

[[bin]]
name = "reels-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "fs"] }
tempfile = "3"

[profile.release]
codegen-units = 16
lto = false
strip = true
