name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - run: pip install -e .[dev]
      - run: python -m pytest -q
      - run: python -m reels check examples/povodok examples/povodok-templates
      - run: python -m reels scenes
      - run: python tools/make_scenes_doc.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build && twine check --strict dist/*
      - name: wheel работает вне репозитория
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/v/bin/reels --version && /tmp/v/bin/reels scenes >/dev/null
          /tmp/v/bin/reels check "$GITHUB_WORKSPACE/examples/povodok-templates"

  example-reel:
    # полный прогон примера без GPU: озвучка и музыка из example/, сборка, кадры, автопроверка, рендер, постер
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -e .
      - name: reels run
        env:
          HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
        run: python -m reels run examples/povodok-templates --yes --edit linear
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: povodok-templates
          path: |
            examples/povodok-templates/out/
            examples/povodok-templates/build/edits/*/qa.json
            examples/povodok-templates/build/edits/*/frames.jpg
