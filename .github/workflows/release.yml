name: release

# Релиз по тегу vX.Y.Z (готовит tools/bump_version.py):
#   build  — sdist + wheel, twine check, проверка версии и состава пакета, установка в чистое окружение, заметки из CHANGELOG
#   pypi   — публикация через Trusted Publishing (без токенов), только в основном репозитории
#   github — GitHub Release с разделом CHANGELOG и файлами dist/
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::тег $GITHUB_REF_NAME не похож на vX.Y.Z[aN|bN|rcN]"
            exit 1
          fi
          prerelease=false
          [[ "$version" =~ (a|b|rc)[0-9]+$ ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          ls -l dist/

      - name: twine check
        run: python -m twine check --strict dist/*

      - name: Tag matches package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wheel="dist/local_ai_reels-${VERSION}-py3-none-any.whl"
          sdist="dist/local_ai_reels-${VERSION}.tar.gz"
          for f in "$wheel" "$sdist"; do
            [ -f "$f" ] || { echo "::error::нет $f — версия в pyproject.toml не совпадает с тегом $GITHUB_REF_NAME"; ls dist/; exit 1; }
          done
          init_version=$(python -c "import ast,sys; t=ast.parse(open('reels/__init__.py',encoding='utf-8').read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and getattr(n.targets[0],'id','')=='__version__'))")
          [ "$init_version" = "$VERSION" ] || { echo "::error::reels/__init__.py: __version__=$init_version, тег $VERSION"; exit 1; }

      - name: Wheel and sdist contain package data
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wheel="dist/local_ai_reels-${VERSION}-py3-none-any.whl"
          sdist="dist/local_ai_reels-${VERSION}.tar.gz"
          unzip -l "$wheel" > wheel.txt
          tar -tzf "$sdist" > sdist.txt
          missing=0
          need() {  # need <listing> <path>
            if ! grep -qF -- "$2" "$1"; then echo "::error::$1: нет $2"; missing=1; fi
          }
          for f in reels/templates/reel.yaml reels/prompts/draft.md reels/qa_layout.mjs reels/scenes/__init__.py \
                   reels/cli.py; do
            need wheel.txt "$f"
            need sdist.txt "$f"
          done
          # вендорные файлы (если появятся) должны попасть в пакет целиком
          if [ -d reels/vendor ]; then
            while IFS= read -r f; do need wheel.txt "$f"; need sdist.txt "$f"; done \
              < <(find reels/vendor -type f ! -name '*.pyc' ! -path '*/__pycache__/*' | sort)
          fi
          for f in LICENSE NOTICE.md CHANGELOG.md README.md README.en.md pyproject.toml; do
            need sdist.txt "local_ai_reels-${VERSION}/$f"
          done
          need wheel.txt "entry_points.txt"
          if grep -E '[[:space:]](tests|scripts|examples|example|local-model-test|docs|tools)/' wheel.txt; then
            echo "::error::в wheel попали лишние каталоги"; missing=1
          fi
          exit $missing

      - name: Smoke test the wheel in a clean venv
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "dist/local_ai_reels-${VERSION}-py3-none-any.whl"
          cd /tmp
          /tmp/venv/bin/reels --version | tee version.txt
          grep -qF "$VERSION" version.txt
          /tmp/venv/bin/reels scenes
          /tmp/venv/bin/reels check "$GITHUB_WORKSPACE/examples/povodok-templates"

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: python
        run: |
          import os, re, sys
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          head = re.search(rf"^## \[?{re.escape(version)}\]?(?:\s.*)?$", text, re.M)
          if not head:
              sys.exit(f"::error::в CHANGELOG.md нет раздела ## [{version}] — запустите tools/bump_version.py {version}")
          nxt = re.compile(r"^## |^\[[^\]]+\]:\s", re.M).search(text, head.end())
          body = text[head.end():nxt.start() if nxt else len(text)].strip()
          if not body:
              sys.exit(f"::error::раздел ## [{version}] в CHANGELOG.md пуст")
          repo = os.environ["GITHUB_REPOSITORY"]
          body += (f"\n\n---\n\n`pip install local-ai-reels=={version}` · "
                   f"[CHANGELOG](https://github.com/{repo}/blob/v{version}/CHANGELOG.md)\n")
          open("release-notes.md", "w", encoding="utf-8").write(body)
          print(body)

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    # форки и копии репозитория не публикуют; на PyPI нужен Trusted Publisher:
    # репозиторий alteralto/local-ai-reels, workflow release.yml, окружение pypi
    if: github.repository == 'alteralto/local-ai-reels'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/local-ai-reels/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    # GitHub Release создаётся после PyPI (или если PyPI пропущен в форке), чтобы не анонсировать неопубликованную версию
    needs: [build, pypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # перезапуск workflow: обновляем файлы и заметки, не падаем
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md "${flags[@]}"
          fi
