name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # версия совпадает с rev в .pre-commit-config.yaml
      - run: python -m pip install "ruff==0.16.9"
      - run: ruff check --output-format=github .
      # `ruff format --check .` пока не обязателен: включим отдельным PR после форматирования всего кода
