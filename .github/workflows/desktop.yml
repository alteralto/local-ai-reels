name: desktop

# Настольное приложение app/desktop (Tauri 2): проверки на Linux, сборка установщиков на трёх ОС.
on:
  push:
    branches: [main]
    paths: ["app/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["app/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app/desktop

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Системные библиотеки Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Сборка установщиков (Tauri CLI из npm)
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v7
        with:
          name: reels-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/desktop/target/release/bundle/**/*.deb
            app/desktop/target/release/bundle/**/*.rpm
            app/desktop/target/release/bundle/**/*.AppImage
            app/desktop/target/release/bundle/**/*.dmg
            app/desktop/target/release/bundle/**/*.msi
            app/desktop/target/release/bundle/**/*.exe
            app/desktop/target/release/reels-desktop
            app/desktop/target/release/reels-desktop.exe
